name: CI

on:
  push:
    paths:
      - 'medora-authority/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'medora-authority/**'

defaults:
  run:
    working-directory: medora-authority

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json, mbstring
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      # Catches parse errors on every supported runtime before any tool runs.
      - name: Lint
        run: find includes -name '*.php' -print0 | xargs -0 -n1 -P4 php -l

      - name: Coding standards
        run: composer lint
        # Style is advisory on the matrix; the 8.2 job below gates it.
        continue-on-error: ${{ matrix.php != '8.2' }}

      - name: Static analysis
        run: composer analyse

      - name: Unit tests
        run: composer test

  js:
    name: Dashboard
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: medora-authority/package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type check
        run: npm run check-types

      - name: Lint
        run: npm run lint:js

      - name: Build
        run: npm run build

      # A build that silently produces nothing would otherwise pass.
      - name: Verify build output
        run: |
          test -f assets/js/app.js
          test -f assets/js/app.asset.php
          test -f assets/js/editor.js
          test -f assets/css/app.css
