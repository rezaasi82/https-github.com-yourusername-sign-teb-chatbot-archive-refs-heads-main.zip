  <script>
  /* jshint browser: true, esversion: 6, devel: true */
  /* global IntersectionObserver */
  (function () {
    'use strict';

    /* ═══════════ پیکربندی مرکزی ═══════════ */
    var CONFIG = {
      whatsapp: '989372896262',
      // ترتیب اهمیت: از خاص‌ترین ظرف محتوا به عام‌ترین
      contentSelectors: ['.entry-content', '.post-content', 'article .elementor-widget-container', 'article', 'main'],
      symptomKeywords: ['علائم', 'علايم', 'نشانه'],
      headingSelector: 'h2, h3',
      maxSymptoms: 6,
      scrollOffset: 90
    };

    /* ═══════════ ابزارهای مشترک (DRY) ═══════════ */
    function each(list, fn) {
      if (!list) return;
      for (var i = 0; i < list.length; i++) fn(list[i], i);
    }
    // آیا المان داخل خود سایدبار است؟ (برای نادیده‌گرفتن تیترهای سایدبار)
    function inSidebar(el) {
      return !!(el && el.closest && el.closest('.f-sidebar'));
    }
    // متن تمیز و بدون فاصله‌های اضافی
    function cleanText(node) {
      return ((node && node.textContent) || '').trim().replace(/\s+/g, ' ');
    }

    // یافتن ظرف اصلی متن مقاله (هرگز خود سایدبار)
    function findContentRoot() {
      for (var i = 0; i < CONFIG.contentSelectors.length; i++) {
        var els = document.querySelectorAll(CONFIG.contentSelectors[i]);
        for (var j = 0; j < els.length; j++) {
          var el = els[j];
          if (inSidebar(el)) continue;
          if (el.querySelector('h2, h3') || el.querySelector('ul, ol')) return el;
        }
      }
      return document.body;
    }

    // یک‌بار پیمایش DOM: تیترهای معتبر مقاله را جمع می‌کند و بین TOC و علائم به اشتراک می‌گذارد
    function collectHeadings(root) {
      var out = [];
      each(root.querySelectorAll(CONFIG.headingSelector), function (h) {
        if (inSidebar(h)) return;
        if (cleanText(h)) out.push(h);
      });
      return out;
    }

    /* ═══════════════════════════════════════════════════════════════
       ‹۱› MODIFIED — فهرست مطالب هوشمند (Smart Table of Contents)
       • فقط تیترهای h2 (تیتر ۱) و h3 (تیتر ۲) خوانده می‌شوند
       • h3 با کلاس .f-toc-h3 به‌صورت تودرتو/تورفته زیر h2 نمایش می‌یابد
       • کلیک → اسکرول نرم؛ اسکرول → افزودن کلاس فعال (is-active) به تیتر جاری
       ═══════════════════════════════════════════════════════════════ */
    function buildTOC(headings) {
      var tocList = document.querySelector('.f-tocl');
      var tocCard = document.querySelector('[data-f-toc-card]');
      if (!tocList) return;

      // بدون تیتر → کارت فهرست پنهان می‌ماند (نمایش مشروط)
      if (!headings.length) {
        if (tocCard) tocCard.style.display = 'none';
        return;
      }

      if (tocCard) tocCard.style.display = 'block';
      tocList.innerHTML = '';
      var linkMap = {};

      each(headings, function (h, i) {
        if (!h.id) h.id = 'f-sec-' + i; // تضمین وجود لنگر برای هر تیتر

        var li = document.createElement('li');
        if (h.tagName === 'H3') li.className = 'f-toc-h3'; // تورفتگی سلسله‌مراتبی

        var a = document.createElement('a');
        a.href = '#' + h.id;
        a.textContent = cleanText(h);
        a.setAttribute('data-target', h.id);
        a.addEventListener('click', onTocClick);

        li.appendChild(a);
        tocList.appendChild(li);
        linkMap[h.id] = a;
      });

      enableScrollSpy(headings, linkMap);
    }

    // اسکرول نرم به تیتر مقصد با احتساب آفست هدر ثابت
    function onTocClick(e) {
      var target = document.getElementById(this.getAttribute('data-target'));
      if (!target) return;
      e.preventDefault();
      var top = target.getBoundingClientRect().top + window.pageYOffset - CONFIG.scrollOffset;
      window.scrollTo({ top: top, behavior: 'smooth' });
    }

    // Scroll-spy: بالاترین تیترِ در حال نمایش را (به ترتیب سند) فعال می‌کند
    function enableScrollSpy(headings, linkMap) {
      if (!('IntersectionObserver' in window)) return;

      var visible = {};       // id تیتر → آیا اکنون در ناحیهٔ دید است؟
      var currentId = null;   // تیتر فعال فعلی (برای پرهیز از پیمایش کامل در هر رویداد)

      var observer = new IntersectionObserver(function (entries) {
        each(entries, function (entry) {
          visible[entry.target.id] = entry.isIntersecting;
        });

        // اولین تیتر قابل‌مشاهده به ترتیب سند = تیتر فعال (پایدار هنگام اسکرول بالا/پایین)
        var activeId = null;
        for (var i = 0; i < headings.length; i++) {
          if (visible[headings[i].id]) { activeId = headings[i].id; break; }
        }
        if (!activeId || activeId === currentId) return;

        if (currentId && linkMap[currentId]) linkMap[currentId].classList.remove('is-active');
        linkMap[activeId].classList.add('is-active');
        currentId = activeId;
      }, { rootMargin: '0px 0px -75% 0px', threshold: 0 });

      each(headings, function (h) { observer.observe(h); });
    }

    /* ═══════════════════════════════════════════════════════════════
       ‹۲› MODIFIED — سکشن «علائم خود را بررسی کنید» (Symptom Checker)
       • متن مقالهٔ جاری اسکن می‌شود؛ اگر تیتری شامل «علائم/علايم/نشانه»
         و پس از آن لیستی (ul/ol) بود، آیتم‌های آن به‌عنوان علائم استخراج
         و جایگزین آیتم‌های سایدبار می‌شوند
       • Fallback: اگر مقاله دربارهٔ بیماری نبود یا علائمی یافت نشد،
         آیتم‌های پیش‌فرضِ داخل HTML دست‌نخورده می‌مانند (سکشن هرگز خالی نمی‌شود)
       ═══════════════════════════════════════════════════════════════ */
    function extractSymptoms(headings) {
      for (var i = 0; i < headings.length; i++) {
        var text = cleanText(headings[i]);
        var isSymptomHead = CONFIG.symptomKeywords.some(function (k) { return text.indexOf(k) !== -1; });
        if (!isSymptomHead) continue;

        // اولین لیست بعد از تیتر علائم را تا رسیدن به تیتر بعدی جست‌وجو کن
        var node = headings[i].nextElementSibling;
        while (node && node.tagName !== 'H2' && node.tagName !== 'H3') {
          if (node.tagName === 'UL' || node.tagName === 'OL') {
            var items = [];
            each(node.querySelectorAll('li'), function (li) {
              var s = cleanText(li);
              if (s) items.push(s);
            });
            if (items.length) return items.slice(0, CONFIG.maxSymptoms);
          }
          node = node.nextElementSibling;
        }
      }
      return []; // یافت نشد → آرایهٔ خالی، یعنی Fallback به پیش‌فرض‌ها
    }

    // آرایهٔ خالی = دست‌نزدن به علائم پیش‌فرض؛ در غیر این صورت جایگزینی کامل
    function renderSymptoms(symptoms) {
      if (!symptoms.length) return; // Fallback: آیتم‌های پیش‌فرض HTML حفظ می‌شوند
      var list = document.querySelector('.f-syml');
      if (!list) return;

      list.innerHTML = '';
      each(symptoms, function (text) {
        var li = document.createElement('li');
        var label = document.createElement('label');
        label.className = 'f-sym-lbl';

        var input = document.createElement('input');
        input.type = 'checkbox';
        input.className = 'f-sym-chk';
        input.value = text;

        var span = document.createElement('span');
        span.textContent = text;

        label.appendChild(input);
        label.appendChild(span);
        li.appendChild(label);
        list.appendChild(li);
      });
    }

    /* ═══════════ ارسال علائم انتخاب‌شده به واتساپ ═══════════ */
    // موضوع مقاله از h1 (یا عنوان صفحه) — بدون دُم برند سایت
    function getArticleTopic() {
      var h1 = document.querySelector('h1');
      var raw = h1 ? h1.textContent : document.title;
      return (raw || '').split('|')[0].split('–')[0].split('-')[0].trim();
    }

    function sendSymptomsToWhatsApp() {
      var selected = [];
      each(document.querySelectorAll('.f-syml .f-sym-chk:checked'), function (el) {
        selected.push(el.value);
      });

      var topic = getArticleTopic();
      var text = 'سلام آقای دکتر فلاح \n';
      text += 'من علائم زیر را' + (topic ? ' در رابطه با «' + topic + '»' : '') + ' دارم:\n\n';

      if (selected.length) {
        each(selected, function (s) { text += '🔹 ' + s + '\n'; });
      } else {
        text += '🔹 مایل به بررسی و معاینه علائم دستم هستم.\n';
      }
      text += '\nخواهشمند است جهت نوبت‌دهی و بررسی پرونده راهنمایی بفرمایید.';

      window.open('https://wa.me/' + CONFIG.whatsapp + '?text=' + encodeURIComponent(text), '_blank');
    }

    /* ═══════════ اجرا و ثبت رویدادها ═══════════ */
    function init() {
      var root = findContentRoot();
      var headings = collectHeadings(root); // یک پیمایش، دو مصرف‌کننده

      buildTOC(headings);                         // ‹۱› فهرست مطالب
      renderSymptoms(extractSymptoms(headings));  // ‹۲› علائم پویا با Fallback

      var submitBtn = document.getElementById('f-submit-symptoms');
      if (submitBtn) submitBtn.addEventListener('click', sendSymptomsToWhatsApp);
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  })();
  </script>
