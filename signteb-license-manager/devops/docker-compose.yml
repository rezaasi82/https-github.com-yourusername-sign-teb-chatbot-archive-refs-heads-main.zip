# SignTeb License Manager — local development / single-host production
services:
  app:
    build:
      context: ..
      dockerfile: devops/Dockerfile
    env_file: ../backend/.env
    volumes:
      - ../backend:/var/www/slm
      - slm-storage:/var/www/slm/storage
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/slm.conf:/etc/nginx/conf.d/default.conf:ro
      - ../backend/public:/var/www/slm/public:ro
    depends_on:
      - app

  queue:
    build:
      context: ..
      dockerfile: devops/Dockerfile
    command: php artisan horizon
    env_file: ../backend/.env
    volumes:
      - ../backend:/var/www/slm
    depends_on:
      - mysql
      - redis

  scheduler:
    build:
      context: ..
      dockerfile: devops/Dockerfile
    command: sh -c "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"
    env_file: ../backend/.env
    volumes:
      - ../backend:/var/www/slm
    depends_on:
      - mysql
      - redis

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: slm
      MYSQL_USER: slm
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - slm-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - slm-redis:/data

volumes:
  slm-mysql:
  slm-redis:
  slm-storage:
